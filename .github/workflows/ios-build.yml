name: iOS build

on:
  workflow_dispatch:
  pull_request:
    paths:
      - ".github/workflows/ios-build.yml"
      - "ios/**"
  push:
    branches:
      - "codex/ios-standalone-app"
      - "codex/ios-scheme-a"
    paths:
      - ".github/workflows/ios-build.yml"
      - "ios/**"

concurrency:
  group: ios-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    runs-on: macos-15
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - name: Install XcodeGen
        run: brew install xcodegen
      - name: Test Shadowrocket-based iOS app
        run: ios/scripts/test-macos.sh
