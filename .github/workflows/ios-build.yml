name: iOS build

on:
  workflow_dispatch:
  pull_request:
    paths:
      - ".github/workflows/ios-build.yml"
      - "ios/**"
  push:
    branches:
      - "codex/ios-standalone-app"
      - "codex/ios-scheme-a"
    paths:
      - ".github/workflows/ios-build.yml"
      - "ios/**"

concurrency:
  group: ios-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    runs-on: macos-15
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - name: Test Shadowrocket module scripts
        run: node ios/scripts/test-shadowrocket-module.mjs
      - name: Install XcodeGen
        run: brew install xcodegen
      - name: Test Shadowrocket-based iOS app
        run: ios/scripts/test-macos.sh
      - name: Package audited unsigned IPA
        env:
          WLOC_BASE_BUNDLE_IDENTIFIER: com.weiweiliang.wloc.schemea
          WLOC_UNSIGNED_IPA_PATH: ${{ runner.temp }}/WLOC-SchemeA-unsigned.ipa
        run: ios/scripts/package-unsigned-macos.sh
      - name: Upload unsigned IPA for local re-signing
        uses: actions/upload-artifact@v4
        with:
          name: WLOC-SchemeA-unsigned
          path: ${{ runner.temp }}/WLOC-SchemeA-unsigned.ipa
          if-no-files-found: error
          retention-days: 7
