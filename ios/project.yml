name: Wloc
options:
  bundleIdPrefix: com.example.wloc
  deploymentTarget:
    iOS: "17.0"
  groupSortPosition: top
  generateEmptyDirectories: true
configs:
  Debug: debug
  Release: release
settings:
  base:
    SWIFT_VERSION: 5.0
    CURRENT_PROJECT_VERSION: 1
    MARKETING_VERSION: 0.1.0
    DEVELOPMENT_TEAM: ""
    CODE_SIGN_STYLE: Automatic
    BASE_BUNDLE_IDENTIFIER: com.example.wloc
  configs:
    Debug:
      ONLY_ACTIVE_ARCH: true
      SWIFT_ACTIVE_COMPILATION_CONDITIONS: DEBUG
packages:
  WlocCore:
    path: Packages/WlocCore
targets:
  Wloc:
    type: application
    platform: iOS
    sources:
      - path: App
    resources:
      - path: App/Resources
    dependencies:
      - package: WlocCore
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(BASE_BUNDLE_IDENTIFIER)
        PRODUCT_NAME: WLOC
        INFOPLIST_KEY_CFBundleDisplayName: WLOC
        INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.utilities
        INFOPLIST_KEY_NSLocationWhenInUseUsageDescription: 用于显示当前位置并验证所选定位是否生效。
        INFOPLIST_KEY_UIApplicationSupportsIndirectInputEvents: true
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        TARGETED_DEVICE_FAMILY: 1
    info:
      path: App/Info.plist
      properties:
        CFBundleURLTypes:
          - CFBundleURLName: com.example.wloc
            CFBundleURLSchemes:
              - wloc
        LSApplicationQueriesSchemes:
          - shadowrocket
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UILaunchScreen: {}
  WlocCoreTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: Packages/WlocCore/Tests/WlocCoreTests
    dependencies:
      - package: WlocCore
    settings:
      base:
        GENERATE_INFOPLIST_FILE: true
        PRODUCT_NAME: WlocCoreTests
schemes:
  Wloc:
    build:
      targets:
        Wloc: all
        WlocCoreTests: [test]
    test:
      targets:
        - WlocCoreTests
