name: Wloc
options:
  bundleIdPrefix: com.example.wloc
  deploymentTarget:
    iOS: "17.0"
  groupSortPosition: top
  generateEmptyDirectories: true
configs:
  Debug: debug
  Release: release
settings:
  base:
    SWIFT_VERSION: 5.0
    CURRENT_PROJECT_VERSION: 1
    MARKETING_VERSION: 0.1.0
    DEVELOPMENT_TEAM: ""
    CODE_SIGN_STYLE: Automatic
    APP_GROUP_IDENTIFIER: group.com.example.wloc
    BASE_BUNDLE_IDENTIFIER: com.example.wloc
    KEYCHAIN_ACCESS_GROUP: $(AppIdentifierPrefix)$(BASE_BUNDLE_IDENTIFIER).shared
  configs:
    Debug:
      SWIFT_ACTIVE_COMPILATION_CONDITIONS: DEBUG
packages:
  WlocCore:
    path: Packages/WlocCore
targets:
  Wloc:
    type: application
    platform: iOS
    sources:
      - path: App
    resources:
      - path: ../wloc.jpg
    dependencies:
      - package: WlocCore
      - framework: Vendor/Libbox.xcframework
        embed: false
      - target: WlocPacketTunnel
        embed: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(BASE_BUNDLE_IDENTIFIER)
        PRODUCT_NAME: WLOC
        INFOPLIST_KEY_CFBundleDisplayName: WLOC
        INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.utilities
        INFOPLIST_KEY_NSLocationWhenInUseUsageDescription: 用于显示当前位置并验证所选定位是否生效。
        INFOPLIST_KEY_NSCameraUsageDescription: 用于扫描代理配置二维码。
        INFOPLIST_KEY_UIApplicationSupportsIndirectInputEvents: true
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        TARGETED_DEVICE_FAMILY: 1
    info:
      path: App/Info.plist
      properties:
        CFBundleURLTypes:
          - CFBundleURLName: com.example.wloc
            CFBundleURLSchemes:
              - wloc
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        BGTaskSchedulerPermittedIdentifiers:
          - $(BASE_BUNDLE_IDENTIFIER).profile-refresh
        UILaunchScreen: {}
        WlocAppGroupIdentifier: $(APP_GROUP_IDENTIFIER)
        WlocKeychainAccessGroup: $(KEYCHAIN_ACCESS_GROUP)
    entitlements:
      path: App/Wloc.entitlements
      properties:
        com.apple.security.application-groups:
          - $(APP_GROUP_IDENTIFIER)
        com.apple.developer.networking.networkextension:
          - packet-tunnel-provider
        keychain-access-groups:
          - $(KEYCHAIN_ACCESS_GROUP)
  WlocPacketTunnel:
    type: app-extension
    platform: iOS
    sources:
      - path: PacketTunnel
    dependencies:
      - package: WlocCore
      - framework: Vendor/Libbox.xcframework
        embed: false
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(BASE_BUNDLE_IDENTIFIER).PacketTunnel
        PRODUCT_NAME: WlocPacketTunnel
        SKIP_INSTALL: true
        APPLICATION_EXTENSION_API_ONLY: true
        TARGETED_DEVICE_FAMILY: 1
    info:
      path: PacketTunnel/Info.plist
      properties:
        NSExtension:
          NSExtensionPointIdentifier: com.apple.networkextension.packet-tunnel
          NSExtensionPrincipalClass: $(PRODUCT_MODULE_NAME).PacketTunnelProvider
        WlocAppGroupIdentifier: $(APP_GROUP_IDENTIFIER)
        WlocKeychainAccessGroup: $(KEYCHAIN_ACCESS_GROUP)
    entitlements:
      path: PacketTunnel/PacketTunnel.entitlements
      properties:
        com.apple.security.application-groups:
          - $(APP_GROUP_IDENTIFIER)
        com.apple.developer.networking.networkextension:
          - packet-tunnel-provider
        keychain-access-groups:
          - $(KEYCHAIN_ACCESS_GROUP)
  WlocCoreTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: Packages/WlocCore/Tests/WlocCoreTests
    dependencies:
      - package: WlocCore
      - framework: Vendor/Libbox.xcframework
        embed: false
    settings:
      base:
        GENERATE_INFOPLIST_FILE: true
        PRODUCT_NAME: WlocCoreTests
schemes:
  Wloc:
    build:
      targets:
        Wloc: all
        WlocPacketTunnel: all
        WlocCoreTests: [test]
    test:
      targets:
        - WlocCoreTests
